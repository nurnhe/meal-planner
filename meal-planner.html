<title>Meal Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a kitchen notebook. Squared-paper background, solid white cards with hairline borders, today's meals up top, the week as seven day cards
   with a flat coloured tile per meal (breakfast yolk, lunch leaf, dinner tomato, snack plum). Basil green for actions, a saffron highlighter for emphasis.
   Type: Bricolage Grotesque for headings, Figtree for text, DM Mono for amounts and labels. */
:root {
  --bg: #F3F5EE; --dot: #DCE3D4; --surface: #FFFFFF; --surface-2: #EEF2E8; --ink: #17251C; --muted: #5F6E63; --line: #D5DDCF; --line-strong: #17251C;
  --accent: #1F6B45; --accent-ink: #FFFFFF; --accent-soft: #DDEEDF; --pop: #F6C445;
  --bf-1: #FFF0C2; --bf-ink: #8A5A00;
  --ln-1: #E0EFD3; --ln-ink: #2F6B1E;
  --dn-1: #FBE1D8; --dn-ink: #B23A22;
  --sn-1: #EEE1F1; --sn-ink: #7A3C86;
  --warn: #B23A22; --warn-soft: #FBE1D8; --ok: #1F6B45;
  --shadow: 0 2px 0 var(--line); --shadow-lg: 0 18px 50px rgba(23, 37, 28, .22);
  --display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", sans-serif;
  --sans: "Figtree", "Avenir Next", "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --s1: #6BBF59; --s2: #E0603F; --s3: #5B9BD5; --s4: #C47AC0; --s5: #E8A93A; --s6: #8C8C8C; --s7: #B98552; --s8: #6CC3D5; --s9: #A0785A; --s10: #E8C547;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1712; --dot: #1B261E; --surface: #17221A; --surface-2: #1E2B22; --ink: #E9F0E6; --muted: #9DAEA1; --line: #2C3B31; --line-strong: #E9F0E6;
  --accent: #7FD39B; --accent-ink: #0F1712; --accent-soft: #1F3A28; --pop: #B88A1C;
  --bf-1: #3A2F12; --bf-ink: #F5CF6E; --ln-1: #1E3318; --ln-ink: #A6DB86; --dn-1: #3C1F18; --dn-ink: #F49A82; --sn-1: #2F2133; --sn-ink: #D9A6E3;
  --warn: #F49A82; --warn-soft: #3C1F18; --ok: #7FD39B;
  --shadow: 0 2px 0 rgba(0, 0, 0, .35); --shadow-lg: 0 18px 50px rgba(0, 0, 0, .6); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1712; --dot: #1B261E; --surface: #17221A; --surface-2: #1E2B22; --ink: #E9F0E6; --muted: #9DAEA1; --line: #2C3B31; --line-strong: #E9F0E6;
  --accent: #7FD39B; --accent-ink: #0F1712; --accent-soft: #1F3A28; --pop: #B88A1C;
  --bf-1: #3A2F12; --bf-ink: #F5CF6E; --ln-1: #1E3318; --ln-ink: #A6DB86; --dn-1: #3C1F18; --dn-ink: #F49A82; --sn-1: #2F2133; --sn-ink: #D9A6E3;
  --warn: #F49A82; --warn-soft: #3C1F18; --ok: #7FD39B;
  --shadow: 0 2px 0 rgba(0, 0, 0, .35); --shadow-lg: 0 18px 50px rgba(0, 0, 0, .6); color-scheme: dark }

* { box-sizing: border-box }
html { min-height: 100% }
body { min-height: 100%; color: var(--ink); font: 400 15px/1.55 var(--sans); background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px); background-size: 22px 22px }
.m-breakfast { --m1: var(--bf-1); --m2: var(--bf-1); --mi: var(--bf-ink) }
.m-lunch { --m1: var(--ln-1); --m2: var(--ln-1); --mi: var(--ln-ink) }
.m-dinner { --m1: var(--dn-1); --m2: var(--dn-1); --mi: var(--dn-ink) }
.m-snack { --m1: var(--sn-1); --m2: var(--sn-1); --mi: var(--sn-ink) }

.wrap { max-width: 1260px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 24px }
h1, h2, h3 { margin: 0; font-family: var(--display); text-wrap: balance; letter-spacing: -.02em }
h1 { font-size: clamp(40px, 6vw, 60px); font-weight: 800; line-height: .95; letter-spacing: -.035em }
h1 em, .today-intro .date em { font-style: normal; background: linear-gradient(transparent 55%, var(--pop) 55% 88%, transparent 88%); padding-inline: 2px }
h2 { font-size: 28px; font-weight: 700; line-height: 1.1 }
h3 { font-size: 19px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em }
p { margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.muted { color: var(--muted) }
.eyebrow { font: 500 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 24px }
.brand { display: grid; gap: 8px }
.top-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px }
nav.tabs, .lang { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; box-shadow: var(--shadow) }
nav.tabs button, .lang button { border: 0; background: none; padding: 8px 15px; border-radius: 9px; font-weight: 500; color: var(--muted); transition: background .2s, color .2s }
.lang button { padding: 8px 11px; font: 500 12.5px var(--mono); letter-spacing: .04em }
nav.tabs button[aria-selected="true"], .lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }

.glass { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow) }
.panel { padding: 22px; display: grid; gap: 16px; min-width: 0 }

/* Buttons */
a.btn { text-decoration: none; color: inherit }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 14px; font-weight: 500; transition: border-color .2s, background .2s; min-height: 38px }
.btn:hover { border-color: var(--ink) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600 }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)) }
.btn.ghost { background: none; border-color: transparent; color: var(--muted) }
.btn.ghost:hover { color: var(--ink) }
.btn.small { padding: 4px 11px; font-size: 13px; min-height: 32px }
.btn.danger { color: var(--warn) }
.btn.danger[data-armed] { background: var(--warn-soft); border-color: transparent }
.btn:disabled { opacity: .45; cursor: default }
.btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.pills { display: flex; flex-wrap: wrap; gap: 6px }
.pills button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px; font-size: 13.5px; font-weight: 500; min-height: 34px; color: var(--muted) }
.pills button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg) }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 6px; background: var(--accent-soft); color: var(--accent) }
.chip { display: inline-block; font: 500 10.5px/1.6 var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 0 7px; border-radius: 5px; background: var(--m1); color: var(--mi); white-space: nowrap }
.chip.example { background: var(--pop); color: #17251C }

/* Icons */
.thumb { display: inline-grid; place-items: center; border-radius: 12px; flex: none; background: var(--m1); color: var(--mi) }
.thumb svg { width: 56%; height: 56% }
svg.i { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.lock-ic { width: 14px; height: 14px; flex: none }

/* Today */
.today { padding: 22px; display: grid; grid-template-columns: minmax(200px, .8fr) repeat(2, minmax(0, 1fr)); gap: 14px; align-items: stretch }
.today-intro { display: grid; align-content: start; gap: 12px; padding: 4px; min-width: 0; grid-column: 1; grid-row: 1 }
.today-intro .date { font: 800 38px/1 var(--display); letter-spacing: -.03em }
.meal { border-radius: 14px; padding: 16px 18px; display: grid; gap: 8px; align-content: start; min-width: 0; text-align: left; border: 1px solid transparent; color: var(--ink);
  background: var(--m1); transition: border-color .2s, transform .2s }
.meal:hover { border-color: var(--mi) }
.meal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mi) }
.meal h3 { font-size: 22px; overflow-wrap: anywhere }
.meal .meta { font: 400 12.5px var(--mono); color: var(--muted) }
.meal .add { color: var(--mi); font-weight: 600 }
.tomorrow { display: grid; gap: 6px; font-size: 13.5px; padding: 12px 4px 4px; border-top: 1px dashed var(--line); align-content: start; grid-column: 1; grid-row: 2 }
.tomorrow li { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 8px }
.tomorrow ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px }
.tomorrow .ml { color: var(--mi); font: 500 11px/1.9 var(--mono); letter-spacing: .06em; text-transform: uppercase }

/* Week */
.weekbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px }
.weekbar h2 { margin-right: auto }
.pager { display: flex; gap: 6px; align-items: center; font-family: var(--mono) }
.pager .btn { min-width: 38px; font-size: 18px; line-height: 1; padding: 6px 12px }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px }
.day { padding: 12px 10px 10px; border-radius: 16px; display: grid; gap: 6px; align-content: start; min-width: 0 }
.day.is-today { border: 2px solid var(--line-strong); box-shadow: 0 3px 0 var(--line-strong) }
.day.is-past { opacity: .7 }
.quiet-note { font-size: 13px; padding-inline: 4px }
.day.is-quiet { align-self: start }
.day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; padding: 0 4px 4px }
.day-head .dow { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.day-head .num { font: 800 30px/.9 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums }
.day.is-today .num { background: linear-gradient(transparent 50%, var(--pop) 50% 92%, transparent 92%); padding-inline: 3px }
.slot { border: 1px solid transparent; text-align: left; border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; color: var(--ink); min-height: 52px;
  background: var(--m1); transition: border-color .15s }
.slot:hover { border-color: var(--mi) }
.slot-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; font: 500 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mi) }
.slot .nm { font-size: 13.5px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.slot.empty { background: transparent; border: 1px dashed color-mix(in srgb, var(--mi) 45%, transparent) }
.slot.empty .nm { color: var(--muted); font-weight: 400 }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 12px 16px; border-radius: 14px; background: color-mix(in srgb, var(--pop) 30%, var(--surface)); border: 1px solid color-mix(in srgb, var(--pop) 70%, var(--line)); font-size: 13.5px }
.legend { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center }
.legend span { display: inline-flex; gap: 6px; align-items: center }

/* Recipes */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center }
.toolbar h2 { margin-right: auto }
.search { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 14px; width: 100%; color: var(--ink) }
.rec-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 8px }
.rec-row { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: left; color: var(--ink); transition: border-color .2s }
.rec-row:hover { border-color: var(--ink) }
.rec-row .nm { font: 700 16px/1.25 var(--display); letter-spacing: -.01em; overflow-wrap: anywhere }
.rec-row .sub { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12.5px; color: var(--muted); margin-top: 4px }
.empty-state { text-align: center; padding: 40px 20px; display: grid; gap: 14px; justify-items: center }
.empty-state p { max-width: 46ch }
.backup { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted) }
.backup p { max-width: 60ch }

/* Shopping */
.shop-sum { font: 400 12.5px var(--mono); color: var(--muted) }
.shop-secs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start }
.shop-sec { display: grid; gap: 0; padding: 14px 14px 8px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); min-width: 0 }
.shop-sec .eyebrow { display: flex; gap: 8px; align-items: center; padding-bottom: 6px; color: var(--ink) }
.sec-dot { width: 9px; height: 9px; border-radius: 3px; background: var(--c) }
.item { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 2px; border-top: 1px dashed var(--line); cursor: pointer }
.item .nm { display: block; overflow-wrap: anywhere; font-weight: 500 }
.item .sub { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere }
.item .amt { font: 500 13px var(--mono); text-align: right; white-space: nowrap }
.item.done .nm, .item.done .amt { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 70%, transparent) }
.check { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 0; border-radius: 6px; border: 1.5px solid color-mix(in srgb, var(--muted) 70%, transparent); background: var(--surface); display: grid; place-items: center; cursor: pointer; transition: background .15s, border-color .15s }
.check::after { content: "✓"; font-size: 14px; font-weight: 700; line-height: 1; color: var(--accent-ink); opacity: 0 }
.check:checked { background: var(--ok); border-color: var(--ok) }
.check:checked::after { opacity: 1 }
.x-btn { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px 8px; border-radius: 8px }
.x-btn:hover { background: var(--warn-soft); color: var(--warn) }
.add-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding-block: 8px 6px; border-top: 1px dashed var(--line) }

/* Forms */
.field { display: grid; gap: 5px; font-size: 13px; font-weight: 500; color: var(--muted); min-width: 0 }
.field .hint { font-size: 12px; font-weight: 400 }
.input { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 12px; color: var(--ink); width: 100%; font-size: 15px; font-weight: 400 }
.input:focus { background: var(--surface); border-color: var(--ink) }
textarea.input { resize: vertical; min-height: 96px; line-height: 1.5 }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.meal-picks { display: flex; flex-wrap: wrap; gap: 6px }
.meal-picks label { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13.5px; cursor: pointer; min-height: 36px }
.meal-picks label:has(input:checked) { background: var(--m1); border-color: var(--mi); color: var(--mi); font-weight: 600 }
.meal-picks input { accent-color: var(--mi); margin: 0 }
.parsed { display: flex; flex-wrap: wrap; gap: 4px; font: 400 11.5px var(--mono) }
.parsed span { padding: 2px 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent) }
.parsed span.raw { background: var(--warn-soft); color: var(--warn) }
.stepper { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 10px; padding: 2px; background: var(--surface) }
.stepper button { border: 0; background: none; width: 32px; height: 32px; border-radius: 8px; font-size: 18px; line-height: 1 }
.stepper button:hover { background: var(--accent-soft); color: var(--accent) }
.stepper span { min-width: 28px; text-align: center; font: 500 14px var(--mono) }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(15, 23, 18, .45); z-index: 20 }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--surface); z-index: 21; box-shadow: var(--shadow-lg);
  display: grid; grid-template-rows: auto minmax(0, 1fr); border-radius: 20px 0 0 20px;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px) }
@media (max-width: 520px) { .sheet { border-radius: 0 } }
.sheet-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; padding: 22px 22px 14px; border-bottom: 1px solid var(--line) }
.sheet-head h2 { font-size: 28px; overflow-wrap: anywhere }
.sheet-head .eyebrow { display: block; margin-bottom: 4px }
.sheet-body { overflow-y: auto; padding: 18px 22px 32px; display: grid; gap: 18px; align-content: start }
.sec { display: grid; gap: 10px; border-radius: 14px; padding: 14px; background: var(--m1) }
.sec h3 { color: var(--mi) }
.ingr { margin: 0; padding: 0; list-style: none; display: grid; gap: 0 }
.ingr li { display: grid; grid-template-columns: minmax(70px, auto) minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 5px 0; border-top: 1px dashed color-mix(in srgb, var(--mi) 30%, transparent); overflow-wrap: anywhere }
.ingr .q { font: 500 13px var(--mono); text-align: right; white-space: nowrap }
.method { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: st }
.method li { counter-increment: st; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; overflow-wrap: anywhere }
.method li::before { content: counter(st); font: 800 18px/1.3 var(--display); color: var(--accent) }
.note { font-style: italic; font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; padding-left: 12px; border-left: 3px solid var(--pop) }
.picks { display: grid; gap: 5px }
.pick { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); text-align: left; color: var(--ink); background: var(--surface); transition: border-color .15s }
.pick:hover { border-color: var(--ink) }
.pick[aria-current="true"] { border: 2px solid var(--accent) }
.pick .nm { font-weight: 600; overflow-wrap: anywhere }
.pick .sub { display: block; font-size: 12px; color: var(--muted) }
.lock-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.status { font-size: 12px; color: var(--muted); margin: 0 }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-size: 14px; line-height: 1.4; text-align: center; z-index: 30; box-shadow: var(--shadow-lg); width: max-content; max-width: min(420px, calc(100% - 32px)); overflow-wrap: anywhere }

.bottom-nav { display: none }
@media (max-width: 1000px) {
  .today { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .today-intro { grid-column: 1 / -1; grid-row: auto }
  .tomorrow { grid-column: 1 / -1; grid-row: auto; order: 5 }
  .week { grid-template-columns: minmax(0, 1fr) }
  .day { grid-template-columns: 64px repeat(4, minmax(0, 1fr)); align-items: stretch }
  .day-head { flex-direction: column; align-items: start; justify-content: start; gap: 4px }
  .day.is-quiet { grid-template-columns: 64px minmax(0, 1fr); align-items: center }
}
@media (max-width: 700px) {
  header.top nav.tabs { display: none }
  header.top { align-items: center }
  h1 { font-size: 36px }
  .brand .eyebrow { display: none }
  .wrap { padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); gap: 18px }
  .toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)) }
  .bottom-nav { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
    background: var(--surface); border-top: 1px solid var(--line) }
  .bottom-nav button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 11.5px; font-weight: 600; color: var(--muted); border-radius: 12px; -webkit-tap-highlight-color: transparent }
  .bottom-nav svg { width: 24px; height: 24px; padding: 3px 14px; box-sizing: content-box; border-radius: 10px; transition: background .2s }
  .bottom-nav button[aria-current="page"] { color: var(--ink) }
  .bottom-nav button[aria-current="page"] svg { background: var(--pop); color: #17251C }
  .panel, .today { padding: 14px }

const H_INGR = /^(ingredients?|you(?:'|’)?ll need|you will need|what you need|ингредиенты|продукты|состав|что понадобится|понадобится|нам понадобится)(?![\p{L}])/iu;

const H_NOTES = /^(notes?|tips?|serving suggestions?|nutrition|storage|variations?|заметки|советы|примечани[ея]|подача|хранение|варианты|пищевая ценность|кбжу)(?![\p{L}])/iu;
const CHATTER = /^(sure|of course|absolutely|great|here(?:'|’)s|here is|here are|certainly|конечно|отлично|вот\s|держи|с удовольствием)/i;
const OUTRO = /^(enjoy|bon app|let me know|hope you|приятного аппетита|наслаждайтесь|если хотите|могу также|хотите,? я)/i;

  if (!r.servings && (m = p.match(/(?:serves|servings?|portions?|makes|yield|порци[йия]|на)\s*:?\s*(\d+)/i) || p.match(/(\d+)\s*(?:servings?|portions?|порци[йия])/i))) r.servings = +m[1];
  if (!r.time && /(time|время|cook|prep|готов|мин|min|hour|час)/i.test(p)) {

    const total = (h ? toNum(h[1]) * 60 : 0) + (mi ? +mi[1] : 0);
    if (total) { r.time = Math.round(total); return true }
  }
  return !!m;
}
function guessMeals(text) {
  const s = text.toLowerCase(), out = [];
  if (/breakfast|brunch|завтрак|oat|porridge|pancake|omelet|granola|smoothie|toast|каша|овсян|сырник|блин|оладь|омлет|яичниц|гранол|смузи|тост/.test(s)) out.push("breakfast");
  if (/snack|перекус|energy ball|hummus|хумус|батончик/.test(s)) out.push("snack");
  if (/lunch|обед|salad|soup|салат|суп|борщ|щи/.test(s)) out.push("lunch");
  if (/dinner|supper|ужин/.test(s) || (!out.length || /soup|суп/.test(s))) out.push("dinner");
  if (out.length === 1 && out[0] === "dinner" && !/dinner|supper|ужин/.test(s)) out.unshift("lunch");

}
function parseRecipe(text) {
  const lines = text.split(/\r?\n/);
  const r = { name: "", servings: null, time: null, ingredients: [], steps: [], notes: [] };
  let mode = "intro";
  for (const line of lines) {
    if (!line.trim() || /^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) continue;
    if (isHeading(line, H_INGR)) { mode = "ingr"; metaFrom(line, r); continue }
    if (isHeading(line, H_STEPS)) { mode = "steps"; metaFrom(line, r); continue }
    if (isHeading(line, H_NOTES)) { mode = "notes"; continue }
    const c = cleanLine(line).replace(/^#+\s*/, "");
    if (!c || OUTRO.test(c)) continue;
    if (mode === "intro") {
      if (CHATTER.test(c)) continue;
      if (metaFrom(line, r) && r.name) continue;
      if (!r.name) { r.name = c.replace(/^\d+[.)]\s*/, "").replace(/^(recipe|рецепт)\s*[:—–-]\s*/i, "").replace(/[:.!]+$/, "").replace(/^[^\p{L}\d]+/u, "").trim(); continue }

      r.notes.push(c);
    } else if (mode === "ingr") {

      if (metaFrom(line, r) && !/^\s*[-*•]/.test(line)) continue;

/* Splits a paste with several recipes: each one starts at the title line before its Ingredients heading. */
function parseRecipes(text) {
  const lines = text.split(/\r?\n/);
  const heads = lines.map((l, i) => (isHeading(l, H_INGR) ? i : -1)).filter(i => i >= 0);
  if (heads.length < 2) { const one = parseRecipe(text); return one ? [one] : [] }
  const starts = [0];
  for (let k = 1; k < heads.length; k++) {
    let s = heads[k] - 1;
    while (s > heads[k - 1] && !lines[s].trim()) s--;
    // walk back over the title and any short meta lines (servings, time) that sit just above the heading
    let j = s;
    for (let back = 0; back < 3 && j > heads[k - 1]; back++) {
      const p = cleanLine(lines[j]);
      if (/^#+\s/.test(lines[j]) || /^\*\*.+\*\*$/.test(lines[j].trim()) || /^\d+[.)]\s*\*\*/.test(lines[j].trim())) { s = j; break }
      if (!p || /\d/.test(p) && p.length < 60) { j--; continue }
      s = j; break;
    }
    starts.push(s);
  }
  return starts.map((s, k) => parseRecipe(lines.slice(s, starts[k + 1] ?? lines.length).join("\n").replace(/^\s*\d+[.)]\s*/, ""))).filter(Boolean);
}

    en: ["Chicken and vegetable traybake", "4 chicken thighs\n400 g potatoes\n2 carrots\n1 red onion\n2 tbsp olive oil\n1 tsp paprika\n1 tsp dried thyme", "Heat the oven to 200 °C.\nCut the vegetables into chunks and toss everything with the oil and spices.\nRoast for 40 minutes, turning once."],
    ru: ["Курица с овощами в духовке", "Куриные бёдра — 4 шт.\nКартофель — 400 г\nМорковь — 2 шт.\nКрасный лук — 1 шт.\nОливковое масло — 2 ст. л.\nПаприка — 1 ч. л.\nТимьян сушёный — 1 ч. л.", "Разогрейте духовку до 200 °C.\nНарежьте овощи крупно и перемешайте всё с маслом и специями.\nЗапекайте 40 минут, один раз перевернув."] },
  { key: "yogurt", meals: ["snack"], servings: 1, time: 5,
    en: ["Yogurt with apple and walnuts", "150 g Greek yogurt\n1 apple\n20 g walnuts\n1 tsp honey", "Chop the apple and walnuts.\nSpoon over the yogurt and drizzle with honey."],
    ru: ["Йогурт с яблоком и орехами", "Греческий йогурт — 150 г\nЯблоко — 1 шт.\nГрецкие орехи — 20 г\nМёд — 1 ч. л.", "Нарежьте яблоко и орехи.\nВыложите на йогурт и полейте мёдом."] }
];
function sampleText(s, r = {}) {
  const [name, ingr, steps] = s[lang];
  return Object.assign(r, { name, ingredients: ingr.split("\n"), steps: steps.split("\n") });
}
const makeSample = s => sampleText(s, { id: uid(), sample: s.key, meals: s.meals.slice(), servings: s.servings, time: s.time, notes: "" });

/* ---------- state and storage ---------- */
const LKEY = "meal-planner";
let state = { recipes: [], plan: {}, shop: {} };
const ui = { tab: matchMedia("(max-width: 700px)").matches ? "today" : "week", weekOffset: 0, recipeFilter: "all", recipeSearch: "", shopRange: "rest", sheet: null };
function load() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(LKEY) || "null") } catch (e) {}
  if (data && Array.isArray(data.recipes)) {
    state = { recipes: data.recipes, plan: data.plan || {}, shop: data.shop || {} };
    lang = data.lang || lang;
    return;
  }
  lang = /^ru|^uk|^be|^kk/i.test(navigator.language || "") ? "ru" : "en";
  state.recipes = SAMPLES.map(makeSample);
  fillWeek(mondayOf(today0()), false);
  save();
}
function save() {
  try { localStorage.setItem(LKEY, JSON.stringify({ v: 1, lang, ...state })) }
  catch (e) { toast(t("saveFail")) }
}
const byId = id => state.recipes.find(r => r.id === id);

/* ---------- dates ---------- */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parseYmd = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d) };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x };
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d };
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const dayDiff = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 864e5);
const fmtDate = (d, o) => new Intl.DateTimeFormat(LOCALE(), o).format(d);
const weekday = d => cap(fmtDate(d, { weekday: "long" }));
const shortDay = d => cap(fmtDate(d, { weekday: "short" }));
const dayMonth = d => fmtDate(d, { day: "numeric", month: "long" });
function relDay(key) {
  const n = dayDiff(key, ymd(today0()));
  if (n === 0) return t("today").toLocaleLowerCase(LOCALE());
  if (n === 1) return t("tomorrow").toLocaleLowerCase(LOCALE());
  const d = parseYmd(key);
  return Math.abs(n) < 7 ? `${shortDay(d)} ${d.getDate()}` : fmtDate(d, { day: "numeric", month: "short" });
}

/* ---------- planning ---------- */
const entry = (key, meal) => state.plan[key]?.[meal];
function setEntry(key, meal, e) {
  if (e) (state.plan[key] ||= {})[meal] = e;
  else if (state.plan[key]) { delete state.plan[key][meal]; if (!Object.keys(state.plan[key]).length) delete state.plan[key] }
}
function* allEntries() { for (const [k, day] of Object.entries(state.plan)) for (const [m, e] of Object.entries(day)) yield [k, m, e] }
/* Picks a recipe for one meal, favouring ones you haven't had for a while and avoiding repeats within the week and on the same day. */
function pickRecipe(key, meal, exclude = []) {
  const cands = state.recipes.filter(r => r.meals.includes(meal) && !exclude.includes(r.id));
  if (!cands.length) return null;
  const ws = ymd(mondayOf(parseYmd(key))), we = ymd(addDays(parseYmd(ws), 6));
  const weights = cands.map(r => {
    let near = null, inWeek = 0, sameDay = false;
    for (const [k, m, e] of allEntries()) {
      if (e.r !== r.id || (k === key && m === meal)) continue;
      const d = Math.abs(dayDiff(k, key));
      if (near == null || d < near) near = d;
      if (k >= ws && k <= we) inWeek++;
      if (k === key) sameDay = true;
    }
    let w = near == null ? 5 : near >= 14 ? 5 : near >= 7 ? 3 : near >= 4 ? 1 : near >= 2 ? .3 : .08;
    w /= 1 + 2.5 * inWeek;
    if (sameDay) w *= .05;
    return w;
  });
  let roll = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < cands.length; i++) { roll -= weights[i]; if (roll <= 0) return cands[i] }
  return cands[cands.length - 1];
}
function fillWeek(monday, reshuffle) {
  const from = ymd(today0());
  let n = 0;
  for (let i = 0; i < 7; i++) {
    const key = ymd(addDays(monday, i));
    if (key < from) continue;
    for (const meal of MEALS) {
      const e = entry(key, meal);
      if (e && (e.lock || !reshuffle)) continue;
      const old = e?.r;
      if (e) setEntry(key, meal, null);
      const r = pickRecipe(key, meal, reshuffle && old && state.recipes.filter(x => x.meals.includes(meal)).length > 1 ? [old] : []);
      if (r) { setEntry(key, meal, { r: r.id, s: r.servings || 1 }); n++ }
    }
  }
  return n;
}
function recipeDates(id) {
  const now = ymd(today0());
  let last = null, next = null;
  for (const [k, , e] of allEntries()) {
    if (e.r !== id) continue;
    if (k < now && (!last || k > last)) last = k;
    if (k >= now && (!next || k < next)) next = k;
  }
  return { last, next };
}

/* ---------- shopping list ---------- */
function shopDays() {
  const now = today0(), mon = mondayOf(now);
  if (ui.shopRange === "next") return [...Array(7)].map((_, i) => ymd(addDays(mon, 7 + i)));
  return [...Array(7)].map((_, i) => addDays(mon, i)).filter(d => d >= now).map(ymd);
}
function buildList(days) {
  const items = new Map();
  for (const key of days) for (const meal of MEALS) {
    const e = entry(key, meal), r = e && byId(e.r);
    if (!r) continue;
    const f = (e.s || r.servings || 1) / (r.servings || e.s || 1);
    for (const line of r.ingredients) {
      if (!line.trim()) continue;
      const p = parseIngredient(line);
      if (isWater(p.name)) continue;
      const k = itemKey(p.name);
      if (!k) continue;
      let it = items.get(k);
      if (!it) items.set(k, it = { key: k, name: cap(p.name), section: sectionOf(p.name), amounts: {}, loose: false, recipes: new Set() });
      it.recipes.add(r.name);
      if (p.qty == null) { if (/to taste|по вкусу/i.test(p.raw)) it.taste = true; it.loose = true; continue }
      const [bu, mul] = BASE[p.unit] || [p.unit || "pcs", 1];
      it.amounts[bu] = (it.amounts[bu] || 0) + p.qty * mul * f;
    }
  }
  for (const it of items.values()) {
    it.amount = Object.entries(it.amounts).map(([u, q]) => fmtAmount(q, u === "pcs" ? null : u, true)).join(" + ");
    if (!it.amount && it.loose && it.section !== "pantry" && /^(salt|pepper|соль|перец)/i.test(it.name)) it.section = "pantry";
  }
  return [...items.values()];
}
function shopStore() {
  const k = ui.shopRange === "next" ? ymd(addDays(mondayOf(today0()), 7)) : ymd(mondayOf(today0()));
  return (state.shop[k] ||= { checked: {}, extra: [] });
}

/* ---------- rendering ---------- */
const $ = s => document.querySelector(s);
function renderChrome() {
  document.documentElement.lang = lang;
  $("#appTitle").innerHTML = t("appTitle");
  $("#tagline").textContent = t("tagline");
  const tabs = ["today", "week", "recipes", "shop"];
  $("#tabs").innerHTML = tabs.map(k => `<button role="tab" data-act="tab" data-tab="${k}" aria-selected="${ui.tab === k}">${t("tab_" + k)}</button>`).join("");
  $("#bottomNav").innerHTML = tabs.map(k => `<button data-act="tab" data-tab="${k}"${ui.tab === k ? ' aria-current="page"' : ""}>${svg(k)}<span>${t("tab_" + k)}</span></button>`).join("");
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
}
function render() {
  renderChrome();
  const main = $("#main");
  main.innerHTML = ui.tab === "today" ? viewToday() : ui.tab === "week" ? viewWeek() : ui.tab === "recipes" ? viewRecipes() : viewShop();
}
const samplesBanner = () => state.recipes.some(r => r.sample)
  ? `<div class="banner"><span>${t("samplesBanner")}</span><button class="btn small" data-act="remove-samples">${t("removeSamples")}</button></div>` : "";
function metaLine(r, e) {
  const bits = [];
  if (r.time) bits.push(t("minutes", { n: r.time }));
  bits.push(t("servingsN", { n: e?.s || r.servings || 1 }));
  return bits.join(" · ");
}

function viewToday() {
  const d = today0(), key = ymd(d), tm = ymd(addDays(d, 1));
  const cards = MEALS.map(meal => {
    const e = entry(key, meal), r = e && byId(e.r);
    return `<button class="meal m-${meal}" data-act="slot" data-date="${key}" data-meal="${meal}">
      <span class="meal-head"><span>${t(meal)}</span>${e?.lock ? svg("lock", "lock-ic") : ""}</span>
      ${r ? `<h3>${esc(r.name)}</h3><span class="meta">${metaLine(r, e)}</span>` : `<h3 class="muted">${t("nothingPlanned")}</h3><span class="add">${t("addMeal")}</span>`}
    </button>`;
  }).join("");
  const tmr = MEALS.map(meal => { const e = entry(tm, meal), r = e && byId(e.r); return r ? `<li class="m-${meal}"><span class="ml">${t(meal)}</span><span>${esc(r.name)}</span></li>` : "" }).join("");
  const anyThisWeek = Object.keys(state.plan).some(k => k >= key && k <= ymd(addDays(mondayOf(d), 6)));
  return `<section class="today glass">
    <div class="today-intro">
      <span class="eyebrow">${weekday(d)}</span>
      <div class="date">${t("today")}, <em>${dayMonth(d)}</em></div>
      <p class="muted" style="font-size:13.5px">${t("todayHint")}</p>
      ${anyThisWeek ? "" : `<div class="btns"><button class="btn primary" data-act="plan-week">${t("planWeek")}</button></div>`}
    </div>
    ${tmr ? `<div class="tomorrow"><span class="eyebrow">${t("tomorrow")}</span><ul>${tmr}</ul></div>` : ""}
    ${cards}
  </section>`;
}

function viewWeek() {
  const mon = addDays(mondayOf(today0()), ui.weekOffset * 7), now = ymd(today0());
  const sun = addDays(mon, 6);
  const range = `${fmtDate(mon, { day: "numeric", month: "short" })} – ${fmtDate(sun, { day: "numeric", month: "short" })}`;
  const days = [...Array(7)].map((_, i) => {
    const d = addDays(mon, i), key = ymd(d);
    const slots = MEALS.map(meal => {
      const e = entry(key, meal), r = e && byId(e.r);
      return `<button class="slot m-${meal}${r ? "" : " empty"}" data-act="slot" data-date="${key}" data-meal="${meal}" aria-label="${esc(weekday(d) + ", " + t(meal) + ": " + (r ? r.name : t("nothingPlanned")))}">
        <span class="slot-head"><span>${t(meal)}</span>${e?.lock ? svg("lock", "lock-ic") : ""}</span>
        <span class="nm">${r ? esc(r.name) : t("addMeal")}</span></button>`;
    }).join("");
    const head = `<div class="day-head"><span class="dow">${shortDay(d)}</span><span class="num">${d.getDate()}</span></div>`;
    if (key < now && !state.plan[key]) return `<article class="day glass is-past is-quiet">${head}<span class="muted quiet-note">${t("nothingPlanned")}</span></article>`;
    return `<article class="day glass${key === now ? " is-today" : ""}${key < now ? " is-past" : ""}">${head}${slots}</article>`;
  }).join("");
  return `${samplesBanner()}
  <section class="weekbar">
    <h2>${ui.weekOffset === 0 ? t("thisWeek") : range}</h2>
    <div class="pager">
      <button class="btn" data-act="week-nav" data-dir="-1" aria-label="${t("prevWeek")}">‹</button>
      ${ui.weekOffset !== 0 ? `<button class="btn small" data-act="week-nav" data-dir="0">${t("thisWeek")}</button>` : `<span class="muted" style="font-size:13.5px">${range}</span>`}
      <button class="btn" data-act="week-nav" data-dir="1" aria-label="${t("nextWeekBtn")}">›</button>
    </div>
    <div class="btns">
      <button class="btn primary" data-act="plan-week">${t("planWeek")}</button>
      <button class="btn" data-act="reshuffle">${t("reshuffle")}</button>
      <button class="btn ghost" data-act="clear-week">${t("clearWeek")}</button>
    </div>
  </section>
  <section class="week">${days}</section>
  <p class="legend"><span>${svg("lock", "lock-ic")} ${t("kept")}</span><span>${t("weekHint")}</span></p>`;
}

function viewRecipes() {
  const q = low(ui.recipeSearch.trim());
  const list = state.recipes
    .filter(r => ui.recipeFilter === "all" || r.meals.includes(ui.recipeFilter))
    .filter(r => !q || low(r.name).includes(q) || r.ingredients.some(i => low(i).includes(q)))
    .sort((a, b) => a.name.localeCompare(b.name, LOCALE()));
  const rows = list.map(r => {
    const { last, next } = recipeDates(r.id);
    const when = next ? t("nextOn", { date: relDay(next) }) : last ? t("lastHad", { date: relDay(last) }) : t("neverPlanned");
    return `<button class="rec-row" data-act="open-recipe" data-id="${r.id}">${thumb(r.meals[0] || "dinner")}
      <span><span class="nm">${esc(r.name)}</span>
      <span class="sub">${r.meals.map(m => `<span class="chip m-${m}">${t(m)}</span>`).join("")}${r.sample ? `<span class="chip example">${t("example")}</span>` : ""}
      ${r.time ? `<span>${t("minutes", { n: r.time })}</span>` : ""}<span>${when}</span></span></span></button>`;
  }).join("");
  const filters = ["all", ...MEALS].map(m => `<button data-act="recipe-filter" data-f="${m}" aria-pressed="${ui.recipeFilter === m}">${t(m)}</button>`).join("");
  const body = !state.recipes.length
    ? `<div class="empty-state"><h3>${t("tab_recipes")}</h3><p class="muted">${t("recipesEmpty")}</p>
        <div class="btns" style="justify-content:center"><button class="btn primary" data-act="paste">${t("pasteRecipe")}</button><button class="btn" data-act="new-recipe">${t("newRecipe")}</button><button class="btn ghost" data-act="load-samples">${t("loadSamples")}</button></div></div>`
    : `<input class="search" id="recipeSearch" type="search" placeholder="${t("search")}" value="${esc(ui.recipeSearch)}" aria-label="${t("search")}">
       <div class="pills" role="group">${filters}</div>
       ${rows ? `<div class="rec-list">${rows}</div>` : `<p class="muted">${t("noMatch")}</p>`}`;
  return `${samplesBanner()}<section class="panel glass">
    <div class="toolbar"><h2>${t("tab_recipes")}</h2>
      <div class="btns"><button class="btn primary" data-act="paste">${t("pasteRecipe")}</button><button class="btn" data-act="new-recipe">${t("newRecipe")}</button></div></div>
    ${body}
  </section>
  <section class="backup"><p>${t("backupHelp")}</p><div class="btns"><button class="btn small" data-act="backup">${t("backup")}</button><button class="btn small" data-act="restore">${t("restore")}</button></div></section>`;
}

function viewShop() {
  const days = shopDays(), items = buildList(days), store = shopStore();
  const ranges = [["rest", t("restOfWeek")], ["next", t("nextWeek")]].map(([k, l]) => `<button data-act="shop-range" data-r="${k}" aria-pressed="${ui.shopRange === k}">${l}</button>`).join("");
  const total = items.length + store.extra.length;
  const left = items.filter(i => !store.checked[i.key]).length + store.extra.filter(x => !x.done).length;
  const secs = SECTIONS.map(sec => {
    const its = items.filter(i => i.section === sec).sort((a, b) => a.name.localeCompare(b.name, LOCALE()));
    if (!its.length) return "";
    return `<div class="shop-sec" style="--c: var(--s${SEC_COLOR[sec]})"><span class="eyebrow"><span class="sec-dot"></span>${t("sec_" + sec)}</span>
      ${its.map(i => `<label class="item${store.checked[i.key] ? " done" : ""}"><input type="checkbox" class="check" data-act="tick" data-key="${esc(i.key)}"${store.checked[i.key] ? " checked" : ""}>
        <span><span class="nm">${esc(i.name)}</span><span class="sub">${esc(t("forList", { list: [...i.recipes].join(", ") }))}</span></span>
        <span class="amt">${esc(i.amount || (i.taste ? t("toTaste") : ""))}</span></label>`).join("")}</div>`;
  }).join("");

    ${store.extra.map(x => `<div class="item${x.done ? " done" : ""}"><input type="checkbox" class="check" data-act="tick-extra" data-id="${x.id}"${x.done ? " checked" : ""} aria-label="${esc(x.text)}"><span class="nm">${esc(x.text)}</span><button class="x-btn" data-act="del-extra" data-id="${x.id}" aria-label="${t("remove")}">×</button></div>`).join("")}
    <form class="add-row" data-form="extra"><input class="input" id="extraItem" placeholder="${t("addItemPh")}" aria-label="${t("addItemPh")}"><button class="btn">${t("add")}</button></form></div>`;
  return `<section class="panel glass">
    <div class="toolbar"><h2>${t("tab_shop")}</h2>
      ${items.length ? `<div class="btns"><button class="btn primary" data-act="copy-list">${t("copyList")}</button><button class="btn ghost" data-act="untick">${t("untick")}</button></div>` : ""}</div>
    <div class="toolbar"><span class="eyebrow">${t("shopFor")}</span><div class="pills" role="group" style="margin-right:auto">${ranges}</div>
      ${total ? `<span class="shop-sum">${left ? t("leftOf", { left, n: total }) : t("allBought")}</span>` : ""}</div>
    ${items.length ? "" : `<div class="empty-state"><p class="muted">${t("shopEmpty")}</p><button class="btn" data-act="tab" data-tab="week">${t("goPlan")}</button></div>`}
    <div class="shop-secs">${secs}${extra}</div>
  </section>`;
}

/* ---------- sheets ---------- */
function openSheet(s) { ui.sheet = s; renderSheet() }
function closeSheet() { ui.sheet = null; $("#sheetRoot").innerHTML = "" }
function sheetFrame(eyebrow, title, body, cls = "") {

}

  const s = ui.sheet, root = $("#sheetRoot");

  else if (s.type === "form") root.innerHTML = sheetForm(s);

  else if (s.type === "copy") root.innerHTML = sheetFrame("", t("listText"), `<p class="muted">${t("copyFail")}</p><textarea class="input" id="copyText" rows="16" readonly>${esc(s.text)}</textarea>`);
  if (s.type === "form") updateParsed();
}
function ingrList(r, servings) {

    if (p.qty == null) return `<li><span class="q"></span><span>${esc(cap(p.raw))}</span></li>`;
    return `<li><span class="q">${esc(fmtAmount(p.qty * f, BASE[p.unit] ? p.unit : p.unit, false))}</span><span>${esc(cap(p.rest))}</span></li>`;
  }).join("")}</ul>`;
}
function sheetRecipe(s) {
  const r = byId(s.id);
  if (!r) return "";
  const n = s.servings ?? r.servings ?? 1;
  const next = [...Array(14)].map((_, i) => ymd(addDays(today0(), i)));
  const meal0 = r.meals[0] || "dinner";
  const body = `
    <div class="btns">${r.meals.map(m => `<span class="chip m-${m}">${t(m)}</span>`).join("")}${r.sample ? `<span class="chip example">${t("example")}</span>` : ""}${r.time ? `<span class="muted" style="font-size:13px">${t("minutes", { n: r.time })}</span>` : ""}</div>
    <div class="sec m-${meal0}">
      <div class="btns" style="justify-content:space-between"><h3>${t("ingrFor", { n: t("servingsN", { n }) })}</h3>
        <span class="stepper"><button data-act="r-serv" data-d="-1" aria-label="−">−</button><span>${n}</span><button data-act="r-serv" data-d="1" aria-label="+">+</button></span></div>
      ${ingrList(r, n)}
    </div>
    ${r.steps.length ? `<div class="sec" style="background:none;padding:0"><h3 style="color:inherit">${t("steps")}</h3><ol class="method">${r.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>` : ""}
    ${r.notes ? `<p class="note">${esc(r.notes)}</p>` : ""}
    <form class="sec m-${meal0}" data-form="add-plan"><h3>${t("addToPlan")}</h3>
      <div class="row2"><label class="field">${t("day")}<select class="input" id="planDay">${next.map(k => `<option value="${k}">${esc(cap(relDay(k)))}${dayDiff(k, ymd(today0())) < 2 ? " · " + dayMonth(parseYmd(k)) : ""}</option>`).join("")}</select></label>
      <label class="field">${t("meal")}<select class="input" id="planMeal">${MEALS.map(m => `<option value="${m}"${m === meal0 ? " selected" : ""}>${t(m)}</option>`).join("")}</select></label></div>
      <div class="btns"><button class="btn primary">${t("addToPlan")}</button></div></form>
    <div class="btns"><button class="btn" data-act="edit-recipe" data-id="${r.id}">${t("edit")}</button><button class="btn danger" data-act="del-recipe" data-id="${r.id}">${t("del")}</button></div>`;
  return sheetFrame(t("tab_recipes"), esc(r.name), body);
}
function sheetForm(s) {
  const d = s.draft;
  const body = `<form data-form="recipe" style="display:grid;gap:14px">
    <label class="field">${t("name")}<input class="input" id="fName" value="${esc(d.name)}" required></label>
    <div class="field">${t("goodFor")}<div class="meal-picks">${MEALS.map(m => `<label class="m-${m}"><input type="checkbox" name="meals" value="${m}"${d.meals.includes(m) ? " checked" : ""}>${t(m)}</label>`).join("")}</div></div>
    <div class="row2"><label class="field">${t("servings")}<input class="input" id="fServ" type="number" min="1" max="50" inputmode="numeric" value="${d.servings || 2}"></label>
      <label class="field">${t("timeMin")}<input class="input" id="fTime" type="number" min="0" max="1440" inputmode="numeric" value="${d.time || ""}"></label></div>
    <label class="field">${t("ingredients")}<textarea class="input" id="fIngr" rows="8" placeholder="${t("ingrHint")}">${esc(d.ingredients.join("\n"))}</textarea><span class="hint">${t("ingrHint")}</span></label>
    <div class="field"><span>${t("readAs")}</span><div class="parsed" id="parsedPreview"></div></div>
    <label class="field">${t("steps")}<textarea class="input" id="fSteps" rows="7" placeholder="${t("stepsHint")}">${esc(d.steps.join("\n"))}</textarea><span class="hint">${t("stepsHint")}</span></label>
    <label class="field">${t("notes")}<textarea class="input" id="fNotes" rows="3">${esc(d.notes || "")}</textarea></label>
    <div class="btns"><button class="btn primary">${t("save")}</button><button type="button" class="btn ghost" data-act="close">${t("cancel")}</button></div>
  </form>`;
  return sheetFrame(s.id ? t("editRecipe") : t("newRecipe"), esc(d.name || t("newRecipe")), body);
}
function updateParsed() {
  const box = $("#parsedPreview"), ta = $("#fIngr");
  if (!box || !ta) return;
  box.innerHTML = ta.value.split("\n").filter(l => l.trim()).map(l => {
    const p = parseIngredient(l);
    return p.qty == null ? `<span class="raw">${esc(cap(p.name))}: ${p.toTaste ? t("toTaste") : t("noAmount")}</span>` : `<span>${esc(fmtAmount(p.qty, p.unit, false))} · ${esc(cap(p.name))}</span>`;
  }).join("");
}
function sheetPaste(s) {
  const found = s.found;
  const body = found
    ? `<p>${t("foundN", { n: found.length })}</p><div class="picks">${found.map((r, i) => `<label class="pick" style="grid-template-columns:20px 40px minmax(0,1fr)"><input type="checkbox" data-i="${i}" checked style="accent-color:var(--accent)">${thumb(r.meals[0] || "dinner", 40)}<span><span class="nm">${esc(r.name)}</span><span class="sub">${r.meals.map(m => t(m)).join(", ")} · ${t("servingsN", { n: r.servings })}</span></span></label>`).join("")}</div>
       <div class="btns"><button class="btn primary" data-act="add-found">${t("addN", { n: found.length })}</button><button class="btn ghost" data-act="paste">${t("cancel")}</button></div>`
    : `<p class="muted">${t("pasteHelp")}</p>
       <textarea class="input" id="pasteText" rows="14" placeholder="${esc(t("pastePh"))}"></textarea>
       <div class="btns"><button class="btn primary" data-act="read-paste">${t("readRecipe")}</button></div>`;
  return sheetFrame(t("tab_recipes"), t("pasteTitle"), body);
}
function sheetSlot(s) {
  const e = entry(s.date, s.meal), r = e && byId(e.r), d = parseYmd(s.date);
  const q = low(s.q || "");
  const pool = state.recipes.filter(x => (s.all || x.meals.includes(s.meal)) && (!q || low(x.name).includes(q))).sort((a, b) => a.name.localeCompare(b.name, LOCALE()));
  const current = r ? `<div class="sec m-${s.meal}">
      <h3>${esc(r.name)}</h3><span class="muted" style="font-size:13px">${r.time ? t("minutes", { n: r.time }) : ""}</span>
      <div class="btns"><span>${t("servings")}</span><span class="stepper"><button data-act="s-serv" data-d="-1" aria-label="−">−</button><span>${e.s || r.servings || 1}</span><button data-act="s-serv" data-d="1" aria-label="+">+</button></span></div>
      <div class="btns"><button class="btn small" data-act="open-recipe" data-id="${r.id}">${t("openRecipe")}</button>
        <button class="btn small" data-act="suggest">${t("suggestAnother")}</button>
        <button class="btn small lock-btn" data-act="lock" aria-pressed="${!!e.lock}">${svg("lock", "lock-ic")} ${t("keep")}</button>
        <button class="btn small ghost" data-act="unplan">${t("remove")}</button></div>
      <span class="muted" style="font-size:12.5px">${t("keepHint")}</span></div>` : "";
  const picks = pool.length ? `<div class="picks">${pool.map(x => `<button class="pick" data-act="choose" data-id="${x.id}"${r && x.id === r.id ? ' aria-current="true"' : ""}>${thumb(x.meals.includes(s.meal) ? s.meal : x.meals[0] || s.meal, 40)}<span><span class="nm">${esc(x.name)}</span><span class="sub">${[x.time ? t("minutes", { n: x.time }) : "", (() => { const { last, next } = recipeDates(x.id); return next ? t("nextOn", { date: relDay(next) }) : last ? t("lastHad", { date: relDay(last) }) : t("neverPlanned") })()].filter(Boolean).join(" · ")}</span></span></button>`).join("")}</div>`
    : `<p class="muted">${q ? t("noMatch") : t("noForMeal", { meal: t(s.meal) })}</p>`;
  const body = `${current}
    <div style="display:grid;gap:10px"><h3>${r ? t("changeRecipe") : t("chooseRecipe")}</h3>
    <input class="search" id="slotSearch" type="search" placeholder="${t("search")}" value="${esc(s.q || "")}" aria-label="${t("search")}">
    <div class="pills"><button data-act="slot-all" aria-pressed="${!!s.all}">${t("showAll")}</button></div>
    <div id="slotPicks">${picks}</div></div>`;
  return sheetFrame(`${weekday(d)}, ${dayMonth(d)}`, t(s.meal), body);
}

/* ---------- actions ---------- */
let toastTimer;
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 3600) }
function commit() { save(); render(); if (ui.sheet) renderSheet() }
function setLang(l) {
  lang = l;
  for (const r of state.recipes) if (r.sample && !r.edited) { const s = SAMPLES.find(x => x.key === r.sample); if (s) sampleText(s, r) }
  commit();
}
function listAsText() {
  const items = buildList(shopDays()), store = shopStore();
  const out = [t("listText")];
  for (const sec of SECTIONS) {
    const its = items.filter(i => i.section === sec && !store.checked[i.key]);
    if (!its.length) continue;
    out.push("", t("sec_" + sec).toUpperCase());
    for (const i of its) out.push(`• ${i.name}${i.amount ? " — " + i.amount : ""}`);
  }
  const ex = store.extra.filter(x => !x.done);
  if (ex.length) { out.push("", t("alsoBuy").toUpperCase()); for (const x of ex) out.push(`• ${x.text}`) }
  return out.join("\n");
}
function saveRecipeForm(form) {
  const s = ui.sheet;
  const name = $("#fName").value.trim();
  if (!name) { toast(t("nameRequired")); $("#fName").focus(); return }
  const data = {
    name, meals: [...form.querySelectorAll('input[name="meals"]:checked')].map(i => i.value),
    servings: Math.max(1, parseInt($("#fServ").value, 10) || 1), time: parseInt($("#fTime").value, 10) || null,
    ingredients: $("#fIngr").value.split("\n").map(l => l.trim()).filter(Boolean),
    steps: $("#fSteps").value.split("\n").map(l => l.replace(/^\s*(?:\d+[.)]|[-*•])\s*/, "").trim()).filter(Boolean),
    notes: $("#fNotes").value.trim()
  };
  let r = s.id && byId(s.id);
  if (r) Object.assign(r, data, { edited: true });
  else { r = { id: uid(), ...data }; state.recipes.push(r) }
  ui.sheet = { type: "recipe", id: r.id };
  commit();
  toast(r.meals.length ? t("saved", { name: r.name }) : t("mealRequired"));
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, s = ui.sheet;
  if (el.type === "checkbox") return; // handled on change
  switch (a) {
    case "tab": ui.tab = el.dataset.tab; closeSheet(); render(); scrollTo({ top: 0 }); break;
    case "lang": setLang(el.dataset.lang); break;
    case "close": if (ev.target === el || el.tagName === "BUTTON") closeSheet(); break;
    case "week-nav": ui.weekOffset = +el.dataset.dir === 0 ? 0 : ui.weekOffset + +el.dataset.dir; render(); break;
    case "plan-week": case "reshuffle": {
      if (!state.recipes.some(r => r.meals.length)) { toast(t("planNone")); break }
      const mon = addDays(mondayOf(today0()), (ui.tab === "week" ? ui.weekOffset : 0) * 7);
      if (ymd(addDays(mon, 6)) < ymd(today0())) { toast(t("planPast")); break }
      const n = fillWeek(mon, a === "reshuffle");
      commit();
      toast(n ? t("planned", { n }) : t("planFull"));
      break;
    }
    case "clear-week": {
      const mon = addDays(mondayOf(today0()), ui.weekOffset * 7), from = ymd(today0());
      for (let i = 0; i < 7; i++) { const k = ymd(addDays(mon, i)); if (k < from) continue; for (const m of MEALS) if (!entry(k, m)?.lock) setEntry(k, m, null) }
      commit(); toast(t("cleared")); break;
    }
    case "slot": openSheet({ type: "slot", date: el.dataset.date, meal: el.dataset.meal, all: false, q: "" }); break;
    case "slot-all": s.all = !s.all; renderSheet(); break;
    case "choose": { const r = byId(el.dataset.id), old = entry(s.date, s.meal); setEntry(s.date, s.meal, { r: r.id, s: r.servings || 1, lock: old?.lock }); save(); closeSheet(); render(); break }
    case "suggest": {
      const cur = entry(s.date, s.meal), r = pickRecipe(s.date, s.meal, [cur.r]);
      if (!r) { toast(t("noOther", { meal: t(s.meal) })); break }
      setEntry(s.date, s.meal, { r: r.id, s: r.servings || 1, lock: cur.lock }); commit(); break;
    }
    case "lock": { const e = entry(s.date, s.meal); e.lock = !e.lock; commit(); break }
    case "unplan": setEntry(s.date, s.meal, null); save(); closeSheet(); render(); break;
    case "s-serv": { const e = entry(s.date, s.meal); e.s = Math.max(1, Math.min(50, (e.s || 1) + +el.dataset.d)); commit(); break }
    case "open-recipe": openSheet({ type: "recipe", id: el.dataset.id }); break;
    case "r-serv": { const r = byId(s.id); s.servings = Math.max(1, Math.min(50, (s.servings ?? r.servings ?? 1) + +el.dataset.d)); renderSheet(); break }
    case "edit-recipe": { const r = byId(el.dataset.id); openSheet({ type: "form", id: r.id, draft: JSON.parse(JSON.stringify(r)) }); break }
    case "new-recipe": openSheet({ type: "form", draft: { name: "", meals: ["lunch", "dinner"], servings: 2, time: null, ingredients: [], steps: [], notes: "" } }); break;
    case "del-recipe": {
      if (!el.dataset.armed) { el.dataset.armed = "1"; el.textContent = t("confirmDelete"); break }
      const r = byId(el.dataset.id);
      state.recipes = state.recipes.filter(x => x.id !== r.id);
      for (const [k, m, e] of [...allEntries()]) if (e.r === r.id) setEntry(k, m, null);
      save(); closeSheet(); render(); toast(t("deleted", { name: r.name })); break;
    }
    case "paste": openSheet({ type: "paste" }); setTimeout(() => $("#pasteText")?.focus(), 50); break;
    case "read-paste": {
      const text = $("#pasteText").value;
      if (!text.trim()) { toast(t("pasteEmpty")); break }
      const found = parseRecipes(text);
      if (!found.length) { toast(t("pasteFail")); break }
      if (found.length === 1) { openSheet({ type: "form", draft: found[0] }); toast(t("checkSave")) }
      else openSheet({ type: "paste", found });
      break;
    }
    case "add-found": {
      const keep = [...document.querySelectorAll(".sheet .pick input")].filter(i => i.checked).map(i => s.found[+i.dataset.i]);
      for (const r of keep) state.recipes.push({ id: uid(), ...r });
      save(); closeSheet(); ui.tab = "recipes"; render(); toast(t("addedN", { n: keep.length })); break;
    }
    case "recipe-filter": ui.recipeFilter = el.dataset.f; render(); break;
    case "remove-samples": {
      const ids = new Set(state.recipes.filter(r => r.sample).map(r => r.id));
      state.recipes = state.recipes.filter(r => !ids.has(r.id));
      for (const [k, m, e] of [...allEntries()]) if (ids.has(e.r)) setEntry(k, m, null);
      commit(); toast(t("samplesRemoved")); break;
    }
    case "load-samples": state.recipes.push(...SAMPLES.map(makeSample)); commit(); break;
    case "shop-range": ui.shopRange = el.dataset.r; render(); break;
    case "untick": { const st = shopStore(); st.checked = {}; st.extra.forEach(x => (x.done = false)); commit(); break }
    case "del-extra": { const st = shopStore(); st.extra = st.extra.filter(x => x.id !== el.dataset.id); commit(); break }
    case "copy-list": {
      const text = listAsText();
      const fallback = () => openSheet({ type: "copy", text });
      try { navigator.clipboard.writeText(text).then(() => toast(t("copied")), fallback) } catch (e) { fallback() }
      break;
    }
    case "backup": {
      try {
        const blob = new Blob([JSON.stringify({ app: "meal-planner", v: 1, lang, ...state }, null, 1)], { type: "application/json" });
        const a2 = document.createElement("a");
        a2.href = URL.createObjectURL(blob); a2.download = `meal-planner-${ymd(today0())}.json`;
        document.body.append(a2); a2.click(); a2.remove();
        setTimeout(() => URL.revokeObjectURL(a2.href), 2000);
        toast(t("backupSaved"));
      } catch (e) { toast(t("saveFail")) }
      break;
    }
    case "restore": $("#restoreFile").click(); break;
  }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset.act === "tick") { const st = shopStore(); if (el.checked) st.checked[el.dataset.key] = true; else delete st.checked[el.dataset.key]; commit() }
  if (el.dataset.act === "tick-extra") { const x = shopStore().extra.find(x => x.id === el.dataset.id); if (x) x.done = el.checked; commit() }
  if (el.id === "restoreFile" && el.files[0]) {
    el.files[0].text().then(txt => {
      const d = JSON.parse(txt);
      if (!Array.isArray(d.recipes)) throw new Error("not a backup");
      state = { recipes: d.recipes, plan: d.plan || {}, shop: d.shop || {} };
      if (d.lang) lang = d.lang;
      commit(); toast(t("restored", { n: d.recipes.length }));
    }).catch(() => toast(t("restoreFail"))).finally(() => (el.value = ""));
  }
});
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id === "recipeSearch") {
    ui.recipeSearch = el.value;
    const pos = el.selectionStart; render();
    const n = $("#recipeSearch"); n.focus(); try { n.setSelectionRange(pos, pos) } catch (e) {}
  }
  if (el.id === "slotSearch") {
    ui.sheet.q = el.value;
    const pos = el.selectionStart; renderSheet();
    const n = $("#slotSearch"); n.focus(); try { n.setSelectionRange(pos, pos) } catch (e) {}
  }
  if (el.id === "fIngr") updateParsed();
});
document.addEventListener("submit", ev => {
  ev.preventDefault();
  const f = ev.target, kind = f.dataset.form;
  if (kind === "recipe") saveRecipeForm(f);
  if (kind === "extra") {
    const v = $("#extraItem").value.trim();
    if (!v) return;
    shopStore().extra.push({ id: uid(), text: v, done: false });
    commit(); $("#extraItem")?.focus();
  }
  if (kind === "add-plan") {
    const r = byId(ui.sheet.id), k = $("#planDay").value, m = $("#planMeal").value;
    setEntry(k, m, { r: r.id, s: ui.sheet.servings ?? r.servings ?? 1 });
    save(); render();
    toast(t("addedToPlan", { name: r.name, meal: t(m).toLocaleLowerCase(LOCALE()), date: relDay(k) }));
  }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && ui.sheet) closeSheet() });

load();
render();
</script>
