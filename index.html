* { box-sizing: border-box }
html { min-height: 100% }
/* Background: a hand-drawn food doodle pattern (tomato, strawberry, lemon, egg, carrot, cherries, leaf, doughnut, sprinkles), drawn for this app. */
body { min-height: 100%; color: var(--ink); font: 400 15px/1.55 var(--sans); background-color: var(--bg);
  background-image: var(--doodle); background-size: 400px 400px; background-attachment: fixed }
.m-breakfast { --m1: var(--bf-1); --m2: var(--bf-1); --mi: var(--bf-ink) }
.m-lunch { --m1: var(--ln-1); --m2: var(--ln-1); --mi: var(--ln-ink) }
.m-dinner { --m1: var(--dn-1); --m2: var(--dn-1); --mi: var(--dn-ink) }
.m-snack { --m1: var(--sn-1); --m2: var(--sn-1); --mi: var(--sn-ink) }
.m-coffee { --m1: var(--cf-1); --m2: var(--cf-1); --mi: var(--cf-ink) }

.wrap { max-width: 1260px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 24px }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 700; text-wrap: balance; letter-spacing: -.02em }
h1 { font-size: clamp(34px, 5vw, 52px); font-weight: 700; line-height: 1; letter-spacing: -.03em }
h1 em, .today-intro .date em { font-style: normal; color: var(--accent) }
h2 { font-size: 24px; font-weight: 700; line-height: 1.15 }
h3 { font-size: 16px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em }
p { margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.muted { color: var(--muted) }
.eyebrow { font: 800 11px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 24px }
.brand { display: grid; gap: 8px }
.top-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px }
nav.tabs, .lang { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; box-shadow: var(--shadow) }
nav.tabs button, .lang button { border: 0; background: none; padding: 8px 15px; border-radius: 9px; font-weight: 500; color: var(--muted); transition: background .2s, color .2s }
.lang.theme-switch button { display: grid; place-items: center; min-width: 36px; min-height: 36px; padding: 0 }
.theme-switch svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.lang button { padding: 8px 11px; font: 500 12.5px var(--mono); letter-spacing: .04em }
nav.tabs button[aria-selected="true"], .lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }

.glass { background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow) }
.panel { padding: 22px; display: grid; gap: 16px; min-width: 0 }

/* Buttons */
a.btn { text-decoration: none; color: inherit }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 16px; font-weight: 700; transition: border-color .2s, background .2s; min-height: 38px }
.btn:hover { border-color: var(--ink) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600 }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)) }
.btn.ghost { background: none; border-color: transparent; color: var(--muted) }
.btn.ghost:hover { color: var(--ink) }
.btn.small { padding: 4px 11px; font-size: 13px; min-height: 32px }
.btn.danger { color: var(--warn) }
.btn.danger[data-armed] { background: var(--warn-soft); border-color: transparent }
.btn:disabled { opacity: .45; cursor: default }
.btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.pills { display: flex; flex-wrap: wrap; gap: 6px }
.pills button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px; font-size: 13.5px; font-weight: 500; min-height: 34px; color: var(--muted) }
.pills button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg) }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 6px; background: var(--accent-soft); color: var(--accent) }
.chip { display: inline-block; font: 500 10.5px/1.6 var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 0 7px; border-radius: 5px; background: var(--m1); color: var(--mi); white-space: nowrap }
.chip.example { background: var(--accent-soft); color: var(--accent) }
.chip.idea { background: var(--ink); color: var(--bg) }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 14px; background: var(--surface-2) }
.seg button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; background: none; border-radius: 10px; min-height: 40px; font: 700 14.5px/1 var(--sans); color: var(--muted) }
.seg button svg { width: 18px; height: 18px }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow) }
.seg button.m-coffee[aria-pressed="true"] { background: var(--m1); color: var(--mi) }

/* Icons */
.thumb { display: inline-grid; place-items: center; border-radius: 12px; flex: none; background: var(--m1); color: var(--mi) }
.thumb svg { width: 56%; height: 56% }
svg.i { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.lock-ic { width: 14px; height: 14px; flex: none }

/* Today */
.today { padding: 22px; display: grid; grid-template-columns: minmax(200px, .8fr) repeat(2, minmax(0, 1fr)); gap: 14px; align-items: stretch }
.today-intro { display: grid; align-content: start; gap: 12px; padding: 4px; min-width: 0; grid-column: 1; grid-row: 1 }
.today-intro .date { font: 700 30px/1.1 var(--display); letter-spacing: -.03em }
.meal { border-radius: 14px; padding: 16px 18px; display: grid; gap: 8px; align-content: start; min-width: 0; text-align: left; border: 1px solid transparent; color: var(--ink);
  background: var(--m1); transition: border-color .2s, transform .2s }
.meal:hover { border-color: var(--mi) }
.meal { position: relative; overflow: hidden }
.meal > * { position: relative }
.meal .big-ic { position: absolute; right: -10px; bottom: -14px; width: 92px; height: 92px; color: var(--mi); opacity: .18; transform: rotate(-14deg); pointer-events: none }
.meal .big-ic svg { width: 100%; height: 100% }
.meal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 800 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mi) }
.meal h3 { font-size: 18px; overflow-wrap: anywhere }
.meal .meta { font: 400 12.5px var(--mono); color: var(--muted) }
.meal .add { color: var(--mi); font-weight: 600 }
.tomorrow { display: grid; gap: 6px; font-size: 13.5px; padding: 12px 4px 4px; border-top: 1px dashed var(--line); align-content: start; grid-column: 1; grid-row: 2 }
.tomorrow li { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 8px }
.tomorrow ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px }
.tomorrow .ml { color: var(--mi); font: 500 11px/1.9 var(--mono); letter-spacing: .06em; text-transform: uppercase }

/* Week */
.weekbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px }
.weekbar h2 { margin-right: auto }
.pager { display: flex; gap: 6px; align-items: center; font-family: var(--mono) }
.pager .btn { min-width: 38px; font-size: 18px; line-height: 1; padding: 6px 12px }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px }
.day { padding: 12px 10px 10px; border-radius: 16px; display: grid; gap: 6px; align-content: start; min-width: 0 }
.day.is-today { border: 2px solid var(--accent) }
.day.is-past { opacity: .7 }
.quiet-note { font-size: 13px; padding-inline: 4px }
.day.is-quiet { align-self: start }
.day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; padding: 0 4px 4px }
.day-head .dow { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.day-head .num { font: 700 26px/.95 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums }
.day.is-today .num { color: var(--accent) }
.slot { border: 1px solid transparent; text-align: left; border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; color: var(--ink); min-height: 52px;
  background: var(--m1); transition: border-color .15s }
.slot:hover { border-color: var(--mi) }
.slot-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; font: 800 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mi) }
.slot .nm { font-size: 13.5px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.slot.empty { background: transparent; border: 1px dashed color-mix(in srgb, var(--mi) 45%, transparent) }
.slot.empty .nm { color: var(--muted); font-weight: 400 }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 12px 16px; border-radius: 14px; background: var(--accent-soft); font-size: 13.5px }
.legend { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center }
.legend span { display: inline-flex; gap: 6px; align-items: center }

/* Recipes */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center }
.toolbar h2 { margin-right: auto }
.search { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 14px; width: 100%; color: var(--ink) }
.rec-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 8px }
.rec-row { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: left; color: var(--ink); transition: border-color .2s }
.rec-row:hover { border-color: var(--ink) }
.rec-row .nm { font: 700 14.5px/1.3 var(--display); letter-spacing: -.01em; overflow-wrap: anywhere }
.rec-row .sub { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12.5px; color: var(--muted); margin-top: 4px }
.empty-state { text-align: center; padding: 40px 20px; display: grid; gap: 14px; justify-items: center }
.empty-state p { max-width: 46ch }
.backup { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted) }
.backup p { max-width: 60ch }

/* Shopping */
.shop-sum { font: 400 12.5px var(--mono); color: var(--muted) }
.shop-secs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start }
.shop-sec { display: grid; gap: 0; padding: 14px 14px 8px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); min-width: 0 }
.shop-sec .eyebrow { display: flex; gap: 8px; align-items: center; padding-bottom: 6px; color: var(--ink) }
.sec-dot { width: 9px; height: 9px; border-radius: 3px; background: var(--c) }
.item { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 2px; border-top: 1px dashed var(--line); cursor: pointer }
.item .nm { display: block; overflow-wrap: anywhere; font-weight: 500 }
.item .sub { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere }
.item .amt { font: 800 13.5px var(--mono); color: var(--accent); text-align: right; white-space: nowrap }
.item.done .nm, .item.done .amt { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 70%, transparent) }
.check { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 0; border-radius: 6px; border: 1.5px solid color-mix(in srgb, var(--muted) 70%, transparent); background: var(--surface); display: grid; place-items: center; cursor: pointer; transition: background .15s, border-color .15s }
.check::after { content: "✓"; font-size: 14px; font-weight: 700; line-height: 1; color: var(--accent-ink); opacity: 0 }
.check:checked { background: var(--ok); border-color: var(--ok) }
.check:checked::after { opacity: 1 }
.x-btn { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px 8px; border-radius: 8px }
.x-btn:hover { background: var(--warn-soft); color: var(--warn) }
.add-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding-block: 8px 6px; border-top: 1px dashed var(--line) }

/* Forms */
.field { display: grid; gap: 5px; font-size: 13px; font-weight: 500; color: var(--muted); min-width: 0 }
.field .hint { font-size: 12px; font-weight: 400 }
.input { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 12px; color: var(--ink); width: 100%; font-size: 15px; font-weight: 400 }
.input:focus { background: var(--surface); border-color: var(--ink) }
textarea.input { resize: vertical; min-height: 96px; line-height: 1.5 }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.meal-picks { display: flex; flex-wrap: wrap; gap: 6px }
.meal-picks label { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13.5px; cursor: pointer; min-height: 36px }
.meal-picks label:has(input:checked) { background: var(--m1); border-color: var(--mi); color: var(--mi); font-weight: 600 }
.meal-picks input { accent-color: var(--mi); margin: 0 }
.parsed { display: flex; flex-wrap: wrap; gap: 4px; font: 400 11.5px var(--mono) }
.parsed span { padding: 2px 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent) }
.parsed span.raw { background: var(--warn-soft); color: var(--warn) }
.stepper { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 10px; padding: 2px; background: var(--surface) }
.stepper button { border: 0; background: none; width: 32px; height: 32px; border-radius: 8px; font-size: 18px; line-height: 1 }
.stepper button:hover { background: var(--accent-soft); color: var(--accent) }
.stepper span { min-width: 28px; text-align: center; font: 500 14px var(--mono) }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(20, 22, 25, .5); z-index: 20 }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--surface); z-index: 21; box-shadow: var(--shadow-lg);
  display: grid; grid-template-rows: auto minmax(0, 1fr); border-radius: 20px 0 0 20px;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px) }
@media (max-width: 520px) { .sheet { border-radius: 0 } }
.sheet-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; padding: 22px 22px 14px; border-bottom: 1px solid var(--line) }
.sheet-head h2 { font-size: 28px; overflow-wrap: anywhere }
.sheet-head .eyebrow { display: block; margin-bottom: 4px }
.sheet-body { overflow-y: auto; padding: 18px 22px 32px; display: grid; gap: 18px; align-content: start }
.sec { display: grid; gap: 10px; border-radius: 14px; padding: 14px; background: var(--m1) }
.sec h3 { color: var(--mi) }
.ingr { margin: 0; padding: 0; list-style: none; display: grid; gap: 0 }
.ingr li { display: grid; grid-template-columns: minmax(70px, auto) minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 5px 0; border-top: 1px dashed color-mix(in srgb, var(--mi) 30%, transparent); overflow-wrap: anywhere }
.ingr .q { font: 800 13.5px var(--mono); text-align: right; white-space: nowrap }
.ingr li.has-ban { grid-template-columns: minmax(70px, auto) minmax(0, 1fr) auto; align-items: center }
.ingr li.avoided > span:nth-child(2) { text-decoration: line-through; text-decoration-color: var(--warn); color: var(--warn) }
.ban-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; margin: -4px 0; border: 0; border-radius: 9px; background: none; color: color-mix(in srgb, var(--mi) 55%, transparent) }
.ban-btn svg { width: 18px; height: 18px }
.ban-btn[aria-pressed="true"] { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent) }
.chip.avoid { background: var(--warn-soft); color: var(--warn) }
.avoid-list { display: flex; flex-wrap: wrap; gap: 6px }
.avoid-tag { display: inline-flex; align-items: center; gap: 2px; padding: 0 0 0 12px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 700; font-size: 14px; min-height: 34px }
.avoid-tag svg { width: 15px; height: 15px; margin-right: 4px }
.avoid-tag .x-btn { color: inherit }
.avoid-why { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 13.5px; font-weight: 600 }
.avoid-why svg { width: 18px; height: 18px; flex: none }
.method { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: st }
.method li { counter-increment: st; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; overflow-wrap: anywhere }
.method li::before { content: counter(st); font: 700 16px/1.4 var(--display); color: var(--accent) }
.note { font-style: italic; font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted) }
.picks { display: grid; gap: 5px }
.pick { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); text-align: left; color: var(--ink); background: var(--surface); transition: border-color .15s }
.pick:hover { border-color: var(--ink) }
.pick[aria-current="true"] { border: 2px solid var(--accent) }
.pick .nm { font-weight: 600; overflow-wrap: anywhere }
.pick .sub { display: block; font-size: 12px; color: var(--muted) }
.lock-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }

function parseRecipe(text) {

const SEC_ORDER = ["dairy", "meat", "bakery", "grains", "tins", "nuts", "pantry", "produce"];
const low = s => s.toLowerCase().replace(/ё/g, "е");
function sectionOf(name) {
  const s = low(name);
  for (const [p, sec] of SPECIFIC) if (s.includes(p)) return sec;
  for (const sec of SEC_ORDER) if (STEM_RE[sec].test(s)) return sec;
  return "other";
}
const isWater = name => /(^|\s)(water|вода|воды|воду|кипяток|кипятка)(\s|$)/.test(low(name)) && low(name).split(" ").length <= 2;
/* A loose key so "Eggs" and "egg", or "Яйца" and "Яйцо", land on one line of the list. */
function itemKey(name) {
  return low(name).replace(/[^a-zа-я ]/g, " ").split(/\s+/).filter(Boolean).map(w => {
    if (/[а-я]/.test(w)) return w.length > 3 ? w.replace(/[аяоеиыуюйь]+$/, "") : w;
    if (w.length <= 3) return w;
    if (/ies$/.test(w)) return w.slice(0, -3) + "y";
    if (/(oes|ches|shes|xes)$/.test(w)) return w.slice(0, -2);
    if (/[^s]s$/.test(w)) return w.slice(0, -1);
    return w;
  }).join(" ");
}
const BASE = { kg: ["g", 1000], l: ["ml", 1000] };
const WHOLE = new Set(["pcs", "can", "pack", "clove", "bunch", "slice", "head"]);
function unitLabel(unit, qty) {
  if (!unit) return lang === "ru" ? "шт." : "";
  const def = UNITS[unit][L()];
  if (!def.includes("|")) return def;
  const [one, many] = def.split("|");
  return qty > 1 ? many : one;
}
function fmtNum(v) {
  const whole = Math.floor(v), f = Math.round((v - whole) * 100) / 100;
  const fr = { .25: "¼", .5: "½", .75: "¾", .33: "⅓", .67: "⅔" }[f];
  if (fr) return (whole || "") + fr;
  return new Intl.NumberFormat(LOCALE(), { maximumFractionDigits: 2 }).format(v);
}
function fmtAmount(qty, unit, shopping) {
  if (qty == null) return "";
  let v = qty, u = unit;
  if (u === "g" && v >= 1000) { v /= 1000; u = "kg" } else if (u === "ml" && v >= 1000) { v /= 1000; u = "l" }
  if (u === "g" || u === "ml") v = v >= 100 ? Math.round(v / 10) * 10 : Math.max(1, Math.round(v));
  else if (u === "kg" || u === "l") v = Math.round(v * 100) / 100;
  else if (shopping && (!u || WHOLE.has(u))) v = Math.ceil(v - 0.01);
  else v = v >= 10 ? Math.round(v) : Math.round(v * 12) / 12;
  const label = unitLabel(u, v);
  return label ? `${fmtNum(v)} ${label}` : fmtNum(v);
}

const makeIdea = s => sampleText(s, { id: uid(), idea: s.key, meals: s.meals.slice(), servings: s.servings, time: s.time });
/* Adds ideas this box hasn't seen yet. Deleted ideas stay deleted. */
function addIdeas() {
  const seen = new Set(state.ideasSeen || []);
  const fresh = IDEAS.filter(s => !seen.has(s.key) && !blockedBy(sampleText(s)));
  if (!fresh.length) return 0;
  state.recipes.push(...fresh.map(makeIdea));
  state.ideasSeen = [...seen, ...fresh.map(s => s.key)];
  state.ideasNew = (state.ideasNew || 0) + fresh.length;
  return fresh.length;
}

/* ---------- state and storage ---------- */
const LKEY = "meal-planner";
let state = { recipes: [], plan: {}, shop: {}, ideasSeen: [], ideasNew: 0, avoid: [] };
const ui = { tab: matchMedia("(max-width: 700px)").matches ? "today" : "week", weekOffset: 0, recipeSection: "food", recipeFilter: "all", recipeSearch: "", shopRange: "rest", sheet: null };
const fromData = d => ({ recipes: d.recipes, plan: d.plan || {}, shop: d.shop || {}, ideasSeen: d.ideasSeen || [], ideasNew: d.ideasNew || 0, avoid: d.avoid || presetAvoid() });
function load() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(LKEY) || "null") } catch (e) {}
  if (data && Array.isArray(data.recipes)) {
    state = fromData(data);
    lang = data.lang || lang;
    if (addIdeas()) save();
    return;
  }
  lang = /^ru|^uk|^be|^kk/i.test(navigator.language || "") ? "ru" : "en";
  state.recipes = SAMPLES.map(makeSample);
  state.avoid = presetAvoid();
  addIdeas();
  fillWeek(mondayOf(today0()), false);
  save();
}
function save() {
  try { localStorage.setItem(LKEY, JSON.stringify({ v: 1, lang, ...state })) }
  catch (e) { toast(t("saveFail")) }
}
const byId = id => state.recipes.find(r => r.id === id);

/* ---------- dates ---------- */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parseYmd = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d) };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x };
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d };
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const dayDiff = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 864e5);
const fmtDate = (d, o) => new Intl.DateTimeFormat(LOCALE(), o).format(d);
const weekday = d => cap(fmtDate(d, { weekday: "long" }));
const shortDay = d => cap(fmtDate(d, { weekday: "short" }));
const dayMonth = d => fmtDate(d, { day: "numeric", month: "long" });
function relDay(key) {
  const n = dayDiff(key, ymd(today0()));
  if (n === 0) return t("today").toLocaleLowerCase(LOCALE());
  if (n === 1) return t("tomorrow").toLocaleLowerCase(LOCALE());
  const d = parseYmd(key);
  return Math.abs(n) < 7 ? `${shortDay(d)} ${d.getDate()}` : fmtDate(d, { day: "numeric", month: "short" });
}

/* ---------- products not to suggest ---------- */
/* Pre-filled from the foods KK skips. Each term matches by word start, so "лук" catches "Красный лук" and "onion" catches "onions". */
const AVOID_PRESET = [
  { key: "onion", label: { en: "Onion", ru: "Лук" }, terms: ["onion", "shallot", "лук", "шалот"] },
  { key: "mushroom", label: { en: "Mushrooms", ru: "Грибы" }, terms: ["mushroom", "champignon", "гриб", "шампиньон", "вешенк", "опят", "лисичк"] },
  { key: "broccoli", label: { en: "Broccoli", ru: "Брокколи" }, terms: ["broccoli", "брокколи"] },
  { key: "sour-cream", label: { en: "Sour cream", ru: "Сметана" }, terms: ["sour cream", "сметан"] },
  { key: "roast-pepper", label: { en: "Roasted peppers", ru: "Печёный перец" }, terms: ["roasted pepper", "baked pepper", "печен перец", "печеный перец", "запеченный перец", "ajvar", "айвар"] }
];
const presetAvoid = () => AVOID_PRESET.map(a => ({ id: uid(), ...JSON.parse(JSON.stringify(a)) }));
const avoidLabel = a => typeof a.label === "string" ? a.label : a.label[lang];
function termHits(name, term) {
  const n = low(name), words = itemKey(term).split(" ").filter(Boolean);
  return words.length > 0 && words.every(w => new RegExp(`(^|[^a-zа-я])${reEsc(w)}`).test(n));
}
const avoidFor = name => (state.avoid || []).find(a => a.terms.some(x => termHits(name, x)));
/* The first avoided product in a recipe, or null. */
function blockedBy(r) {
  for (const line of r.ingredients) { if (!line.trim()) continue; const a = avoidFor(parseIngredient(line).name); if (a) return a }
  return null;
}

/* ---------- planning ---------- */
const entry = (key, meal) => state.plan[key]?.[meal];
function setEntry(key, meal, e) {
  if (e) (state.plan[key] ||= {})[meal] = e;
  else if (state.plan[key]) { delete state.plan[key][meal]; if (!Object.keys(state.plan[key]).length) delete state.plan[key] }
}
function* allEntries() { for (const [k, day] of Object.entries(state.plan)) for (const [m, e] of Object.entries(day)) yield [k, m, e] }
/* Picks a recipe for one meal, favouring ones you haven't had for a while and avoiding repeats within the week and on the same day. */
function pickRecipe(key, meal, exclude = []) {
  const cands = state.recipes.filter(r => r.meals.includes(meal) && !exclude.includes(r.id) && !blockedBy(r));
  if (!cands.length) return null;
  const ws = ymd(mondayOf(parseYmd(key))), we = ymd(addDays(parseYmd(ws), 6));
  const weights = cands.map(r => {
    let near = null, inWeek = 0, sameDay = false;
    for (const [k, m, e] of allEntries()) {
      if (e.r !== r.id || (k === key && m === meal)) continue;
      const d = Math.abs(dayDiff(k, key));
      if (near == null || d < near) near = d;
      if (k >= ws && k <= we) inWeek++;
      if (k === key) sameDay = true;
    }
    let w = near == null ? 5 : near >= 14 ? 5 : near >= 7 ? 3 : near >= 4 ? 1 : near >= 2 ? .3 : .08;
    w /= 1 + 2.5 * inWeek;
    if (sameDay) w *= .05;
    return w;
  });
  let roll = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < cands.length; i++) { roll -= weights[i]; if (roll <= 0) return cands[i] }
  return cands[cands.length - 1];
}
function fillWeek(monday, reshuffle) {
  const from = ymd(today0());
  let n = 0;
  for (let i = 0; i < 7; i++) {
    const key = ymd(addDays(monday, i));
    if (key < from) continue;
    for (const meal of MEALS) {
      const e = entry(key, meal);
      if (e && (e.lock || !reshuffle)) continue;
      const old = e?.r;
      if (e) setEntry(key, meal, null);
      const r = pickRecipe(key, meal, reshuffle && old && state.recipes.filter(x => x.meals.includes(meal)).length > 1 ? [old] : []);
      if (r) { setEntry(key, meal, { r: r.id, s: r.servings || 1 }); n++ }
    }
  }
  return n;
}
function recipeDates(id) {
  const now = ymd(today0());
  let last = null, next = null;
  for (const [k, , e] of allEntries()) {
    if (e.r !== id) continue;
    if (k < now && (!last || k > last)) last = k;
    if (k >= now && (!next || k < next)) next = k;
  }
  return { last, next };
}

/* ---------- shopping list ---------- */
function shopDays() {
  const now = today0(), mon = mondayOf(now);
  if (ui.shopRange === "next") return [...Array(7)].map((_, i) => ymd(addDays(mon, 7 + i)));
  return [...Array(7)].map((_, i) => addDays(mon, i)).filter(d => d >= now).map(ymd);
}
function buildList(days) {
  const items = new Map();
  for (const key of days) for (const meal of MEALS) {
    const e = entry(key, meal), r = e && byId(e.r);
    if (!r) continue;
    const f = (e.s || r.servings || 1) / (r.servings || e.s || 1);
    for (const line of r.ingredients) {
      if (!line.trim()) continue;
      const p = parseIngredient(line);
      if (isWater(p.name)) continue;
      const k = itemKey(p.name);
      if (!k) continue;
      let it = items.get(k);
      if (!it) items.set(k, it = { key: k, name: cap(p.name), section: sectionOf(p.name), amounts: {}, loose: false, recipes: new Set() });
      it.recipes.add(r.name);
      if (p.qty == null) { if (/to taste|по вкусу/i.test(p.raw)) it.taste = true; it.loose = true; continue }
      const [bu, mul] = BASE[p.unit] || [p.unit || "pcs", 1];
      it.amounts[bu] = (it.amounts[bu] || 0) + p.qty * mul * f;
    }
  }
  for (const it of items.values()) {
    it.amount = Object.entries(it.amounts).map(([u, q]) => fmtAmount(q, u === "pcs" ? null : u, true)).join(" + ");
    if (!it.amount && it.loose && it.section !== "pantry" && /^(salt|pepper|соль|перец)/i.test(it.name)) it.section = "pantry";
  }
  return [...items.values()];
}
function shopStore() {
  const k = ui.shopRange === "next" ? ymd(addDays(mondayOf(today0()), 7)) : ymd(mondayOf(today0()));
  return (state.shop[k] ||= { checked: {}, extra: [] });
}

  const pool = state.recipes.filter(x => (s.all ? !isCoffee(x) : x.meals.includes(s.meal)) && (!q || low(x.name).includes(q))).sort((a, b) => a.name.localeCompare(b.name, LOCALE()));
  const current = r ? `<div class="sec m-${s.meal}">
      <h3>${esc(r.name)}</h3><span class="muted" style="font-size:13px">${r.time ? t("minutes", { n: r.time }) : ""}</span>
      <div class="btns"><span>${t("servings")}</span><span class="stepper"><button data-act="s-serv" data-d="-1" aria-label="−">−</button><span>${e.s || r.servings || 1}</span><button data-act="s-serv" data-d="1" aria-label="+">+</button></span></div>
      <div class="btns"><button class="btn small" data-act="open-recipe" data-id="${r.id}">${t("openRecipe")}</button>
        <button class="btn small" data-act="suggest">${t("suggestAnother")}</button>
        <button class="btn small lock-btn" data-act="lock" aria-pressed="${!!e.lock}">${svg("lock", "lock-ic")} ${t("keep")}</button>
        <button class="btn small ghost" data-act="unplan">${t("remove")}</button></div>
      <span class="muted" style="font-size:12.5px">${t("keepHint")}</span></div>` : "";
  const picks = pool.length ? `<div class="picks">${pool.map(x => `<button class="pick" data-act="choose" data-id="${x.id}"${r && x.id === r.id ? ' aria-current="true"' : ""}>${thumb(x.meals.includes(s.meal) ? s.meal : x.meals[0] || s.meal, 40)}<span><span class="nm">${esc(x.name)}</span><span class="sub">${[blockedBy(x) ? t("avoidChip") : "", x.time ? t("minutes", { n: x.time }) : "", (() => { const { last, next } = recipeDates(x.id); return next ? t("nextOn", { date: relDay(next) }) : last ? t("lastHad", { date: relDay(last) }) : t("neverPlanned") })()].filter(Boolean).join(" · ")}</span></span></button>`).join("")}</div>`
    : `<p class="muted">${q ? t("noMatch") : t("noForMeal", { meal: t(s.meal) })}</p>`;
  const body = `${current}
    <div style="display:grid;gap:10px"><h3>${r ? t("changeRecipe") : t("chooseRecipe")}</h3>
    <input class="search" id="slotSearch" type="search" placeholder="${t("search")}" value="${esc(s.q || "")}" aria-label="${t("search")}">
    <div class="pills"><button data-act="slot-all" aria-pressed="${!!s.all}">${t("showAll")}</button></div>
    <div id="slotPicks">${picks}</div></div>`;
  return sheetFrame(`${weekday(d)}, ${dayMonth(d)}`, t(s.meal), body);
}

/* ---------- actions ---------- */
let toastTimer;
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 3600) }
function commit() { save(); render(); if (ui.sheet) renderSheet() }
function setLang(l) {
  lang = l;
  for (const r of state.recipes) if ((r.sample || r.idea) && !r.edited) { const s = r.sample ? SAMPLES.find(x => x.key === r.sample) : IDEAS.find(x => x.key === r.idea); if (s) sampleText(s, r) }
  commit();
}
function listAsText() {
  const items = buildList(shopDays()), store = shopStore();
  const out = [t("listText")];
  for (const sec of SECTIONS) {
    const its = items.filter(i => i.section === sec && !store.checked[i.key]);
    if (!its.length) continue;
    out.push("", t("sec_" + sec).toUpperCase());
    for (const i of its) out.push(`• ${i.name}${i.amount ? " — " + i.amount : ""}`);
  }
  const ex = store.extra.filter(x => !x.done);
  if (ex.length) { out.push("", t("alsoBuy").toUpperCase()); for (const x of ex) out.push(`• ${x.text}`) }
  return out.join("\n");
}
function saveRecipeForm(form) {
  const s = ui.sheet;
  const name = $("#fName").value.trim();
  if (!name) { toast(t("nameRequired")); $("#fName").focus(); return }
  const data = {
    name, meals: [...form.querySelectorAll('input[name="meals"]:checked')].map(i => i.value),
    servings: Math.max(1, parseInt($("#fServ").value, 10) || 1), time: parseInt($("#fTime").value, 10) || null,
    ingredients: $("#fIngr").value.split("\n").map(l => l.trim()).filter(Boolean),
    steps: $("#fSteps").value.split("\n").map(l => l.replace(/^\s*(?:\d+[.)]|[-*•])\s*/, "").trim()).filter(Boolean),
    notes: $("#fNotes").value.trim()
  };
  let r = s.id && byId(s.id);
  if (r) Object.assign(r, data, { edited: true });
  else { r = { id: uid(), ...data }; state.recipes.push(r) }
  ui.sheet = { type: "recipe", id: r.id };
  commit();
  toast(r.meals.length ? t("saved", { name: r.name }) : t("mealRequired"));
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, s = ui.sheet;
  if (el.type === "checkbox") return; // handled on change
  switch (a) {
    case "tab": ui.tab = el.dataset.tab; closeSheet(); render(); scrollTo({ top: 0 }); break;
    case "lang": setLang(el.dataset.lang); break;
    case "close": if (ev.target === el || el.tagName === "BUTTON") closeSheet(); break;
    case "week-nav": ui.weekOffset = +el.dataset.dir === 0 ? 0 : ui.weekOffset + +el.dataset.dir; render(); break;
    case "plan-week": case "reshuffle": {
      if (!state.recipes.some(r => r.meals.length)) { toast(t("planNone")); break }
      const mon = addDays(mondayOf(today0()), (ui.tab === "week" ? ui.weekOffset : 0) * 7);
      if (ymd(addDays(mon, 6)) < ymd(today0())) { toast(t("planPast")); break }
      const n = fillWeek(mon, a === "reshuffle");
      commit();
      toast(n ? t("planned", { n }) : t("planFull"));
      break;
    }
    case "clear-week": {
      const mon = addDays(mondayOf(today0()), ui.weekOffset * 7), from = ymd(today0());
      for (let i = 0; i < 7; i++) { const k = ymd(addDays(mon, i)); if (k < from) continue; for (const m of MEALS) if (!entry(k, m)?.lock) setEntry(k, m, null) }
      commit(); toast(t("cleared")); break;
    }
    case "slot": openSheet({ type: "slot", date: el.dataset.date, meal: el.dataset.meal, all: false, q: "" }); break;
    case "slot-all": s.all = !s.all; renderSheet(); break;
    case "choose": { const r = byId(el.dataset.id), old = entry(s.date, s.meal); setEntry(s.date, s.meal, { r: r.id, s: r.servings || 1, lock: old?.lock }); save(); closeSheet(); render(); break }
    case "suggest": {
      const cur = entry(s.date, s.meal), r = pickRecipe(s.date, s.meal, [cur.r]);
      if (!r) { toast(t("noOther", { meal: t(s.meal) })); break }
      setEntry(s.date, s.meal, { r: r.id, s: r.servings || 1, lock: cur.lock }); commit(); break;
    }
    case "lock": { const e = entry(s.date, s.meal); e.lock = !e.lock; commit(); break }
    case "unplan": setEntry(s.date, s.meal, null); save(); closeSheet(); render(); break;
    case "s-serv": { const e = entry(s.date, s.meal); e.s = Math.max(1, Math.min(50, (e.s || 1) + +el.dataset.d)); commit(); break }
    case "open-recipe": openSheet({ type: "recipe", id: el.dataset.id }); break;
    case "r-serv": { const r = byId(s.id); s.servings = Math.max(1, Math.min(50, (s.servings ?? r.servings ?? 1) + +el.dataset.d)); renderSheet(); break }
    case "edit-recipe": { const r = byId(el.dataset.id); openSheet({ type: "form", id: r.id, draft: JSON.parse(JSON.stringify(r)) }); break }
    case "new-recipe": openSheet({ type: "form", draft: { name: "", meals: ui.recipeSection === "coffee" ? ["coffee"] : ["lunch", "dinner"], servings: 2, time: null, ingredients: [], steps: [], notes: "" } }); break;
    case "del-recipe": {
      if (!el.dataset.armed) { el.dataset.armed = "1"; el.textContent = t("confirmDelete"); break }
      const r = byId(el.dataset.id);
      state.recipes = state.recipes.filter(x => x.id !== r.id);
      for (const [k, m, e] of [...allEntries()]) if (e.r === r.id) setEntry(k, m, null);
      save(); closeSheet(); render(); toast(t("deleted", { name: r.name })); break;
    }
    case "paste": openSheet({ type: "paste" }); setTimeout(() => $("#pasteText")?.focus(), 50); break;
    case "read-paste": {
      const text = $("#pasteText").value;
      if (!text.trim()) { toast(t("pasteEmpty")); break }
      const found = parseRecipes(text);
      if (!found.length) { toast(t("pasteFail")); break }
      if (found.length === 1) { openSheet({ type: "form", draft: found[0] }); toast(t("checkSave")) }
      else openSheet({ type: "paste", found });
      break;
    }
    case "add-found": {
      const keep = [...document.querySelectorAll(".sheet .pick input")].filter(i => i.checked).map(i => s.found[+i.dataset.i]);
      for (const r of keep) state.recipes.push({ id: uid(), ...r });
      save(); closeSheet(); ui.tab = "recipes"; render(); toast(t("addedN", { n: keep.length })); break;
    }
    case "recipe-filter": ui.recipeFilter = el.dataset.f; render(); break;
    case "recipe-section": ui.recipeSection = el.dataset.s; render(); break;
    case "ideas-ok": state.ideasNew = 0; commit(); break;
    case "toggle-avoid": {
      const name = el.dataset.name, a = avoidFor(name);
      if (a) { state.avoid = state.avoid.filter(x => x !== a); commit(); toast(t("avoidRemoved", { item: avoidLabel(a) })) }
      else { const label = cap(name.trim()); state.avoid.push({ id: uid(), label, terms: [label] }); commit(); toast(t("avoidAdded", { item: label })) }
      break;
    }
    case "unavoid": { const a = state.avoid.find(x => x.id === el.dataset.id); state.avoid = state.avoid.filter(x => x !== a); commit(); if (a) toast(t("avoidRemoved", { item: avoidLabel(a) })); break }
    case "add-to-list": {
      const r = byId(s.id), n = s.servings ?? r.servings ?? 1, f = n / (r.servings || n || 1), st = shopStore();
      for (const line of r.ingredients) {
        const p = parseIngredient(line);
        if (!line.trim() || isWater(p.name)) continue;
        st.extra.push({ id: uid(), text: cap(p.name) + (p.qty != null ? " — " + fmtAmount(p.qty * f, p.unit, true) : ""), done: false });
      }
      commit(); toast(t("addedToList", { name: r.name })); break;
    }
    case "remove-samples": {
      const ids = new Set(state.recipes.filter(r => r.sample).map(r => r.id));
      state.recipes = state.recipes.filter(r => !ids.has(r.id));
      for (const [k, m, e] of [...allEntries()]) if (ids.has(e.r)) setEntry(k, m, null);
      commit(); toast(t("samplesRemoved")); break;
    }
    case "load-samples": state.recipes.push(...SAMPLES.map(makeSample)); commit(); break;
    case "shop-range": ui.shopRange = el.dataset.r; render(); break;
    case "untick": { const st = shopStore(); st.checked = {}; st.extra.forEach(x => (x.done = false)); commit(); break }
    case "del-extra": { const st = shopStore(); st.extra = st.extra.filter(x => x.id !== el.dataset.id); commit(); break }
    case "copy-list": {
      const text = listAsText();
      const fallback = () => openSheet({ type: "copy", text });
      try { navigator.clipboard.writeText(text).then(() => toast(t("copied")), fallback) } catch (e) { fallback() }
      break;
    }
    case "backup": {
      try {
        const blob = new Blob([JSON.stringify({ app: "meal-planner", v: 1, lang, ...state }, null, 1)], { type: "application/json" });
        const a2 = document.createElement("a");
        a2.href = URL.createObjectURL(blob); a2.download = `meal-planner-${ymd(today0())}.json`;
        document.body.append(a2); a2.click(); a2.remove();
        setTimeout(() => URL.revokeObjectURL(a2.href), 2000);
        toast(t("backupSaved"));
      } catch (e) { toast(t("saveFail")) }
      break;
    }
    case "restore": $("#restoreFile").click(); break;
  }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset.act === "tick") { const st = shopStore(); if (el.checked) st.checked[el.dataset.key] = true; else delete st.checked[el.dataset.key]; commit() }
  if (el.dataset.act === "tick-extra") { const x = shopStore().extra.find(x => x.id === el.dataset.id); if (x) x.done = el.checked; commit() }
  if (el.id === "restoreFile" && el.files[0]) {
    el.files[0].text().then(txt => {
      const d = JSON.parse(txt);
      if (!Array.isArray(d.recipes)) throw new Error("not a backup");
      state = fromData(d);
      if (d.lang) lang = d.lang;
      addIdeas();
      commit(); toast(t("restored", { n: d.recipes.length }));
    }).catch(() => toast(t("restoreFail"))).finally(() => (el.value = ""));
  }
});
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id === "recipeSearch") {
    ui.recipeSearch = el.value;
    const pos = el.selectionStart; render();
    const n = $("#recipeSearch"); n.focus(); try { n.setSelectionRange(pos, pos) } catch (e) {}
  }
  if (el.id === "slotSearch") {
    ui.sheet.q = el.value;
    const pos = el.selectionStart; renderSheet();
    const n = $("#slotSearch"); n.focus(); try { n.setSelectionRange(pos, pos) } catch (e) {}
  }
  if (el.id === "fIngr") updateParsed();
});
document.addEventListener("submit", ev => {
  ev.preventDefault();
  const f = ev.target, kind = f.dataset.form;
  if (kind === "recipe") saveRecipeForm(f);
  if (kind === "extra") {
    const v = $("#extraItem").value.trim();
    if (!v) return;
    shopStore().extra.push({ id: uid(), text: v, done: false });
    commit(); $("#extraItem")?.focus();
  }
  if (kind === "avoid") {
    const v = cap($("#avoidItem").value.trim());
    if (!v || !itemKey(v)) return;
    if (!state.avoid.some(a => low(avoidLabel(a)) === low(v))) state.avoid.push({ id: uid(), label: v, terms: [v] });
    commit(); toast(t("avoidAdded", { item: v })); $("#avoidItem")?.focus();
  }
  if (kind === "add-plan") {
    const r = byId(ui.sheet.id), k = $("#planDay").value, m = $("#planMeal").value;
    setEntry(k, m, { r: r.id, s: ui.sheet.servings ?? r.servings ?? 1 });
    save(); render();
    toast(t("addedToPlan", { name: r.name, meal: t(m).toLocaleLowerCase(LOCALE()), date: relDay(k) }));
  }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && ui.sheet) closeSheet() });

load();
render();
</script>

<script>if ("serviceWorker" in navigator) {
  // When an update takes over from an older version, reload once so it shows straight away.
  let hadController = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded) { reloaded = true; location.reload() } hadController = true });
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
}</script>
